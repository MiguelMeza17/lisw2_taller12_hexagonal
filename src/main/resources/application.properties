spring.application.name=saberpro-hexagonal

# Adaptador de persistencia del puerto PreguntaRepositoryPort: jpa (H2) | memoria (HashMap)
# Cambiarlo no requiere tocar el paquete domain (prueba de intercambiabilidad).
saberpro.persistencia=jpa

# Base de datos H2 en memoria (usada por el adaptador JpaQuestionAdapter)
spring.datasource.url=jdbc:h2:mem:saberprodb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Consola web de H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
