name: Verificacion hexagonal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: El dominio no depende de Spring ni JPA
        run: |
          if grep -rnE "org\.springframework|jakarta\.persistence|javax\.persistence" src/main/java/co/edu/unicauca/saberpro/domain; then
            echo "El paquete domain importa dependencias de framework."
            exit 1
          fi

      - name: Pruebas
        run: mvn -B test
